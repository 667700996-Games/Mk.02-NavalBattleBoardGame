name: mk01-naval-command

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mk01
      POSTGRES_USER: mk01
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-mk01-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mk01 -d mk01"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      STORAGE_MODE: postgres
      DATABASE_URL: postgres://mk01:${POSTGRES_PASSWORD:-local-mk01-password}@postgres:5432/mk01
      REDIS_URL: redis://redis:6379/
      PUBLIC_BASE_URL: http://localhost:8088
      ALLOWED_ORIGINS: http://localhost:8088
      SECURE_COOKIES: "false"
      SESSION_TTL_SECONDS: 2592000
      RECONNECT_GRACE_SECONDS: 90
      TURN_DURATION_SECONDS: 60
      API_REQUESTS_PER_MINUTE: 240
      HTTP_REQUESTS_PER_MINUTE_PER_IP: 600
      SESSION_CREATIONS_PER_MINUTE: 20
      WEBSOCKET_EVENTS_PER_SECOND: 60
      WEBSOCKET_SEND_QUEUE_CAPACITY: 256
      MAX_WEBSOCKET_CONNECTIONS: 10000
      TRUST_PROXY_HEADERS: "true"
      RUST_LOG: mk01_server=info,tower_http=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mk01-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: http://localhost:8088
    depends_on:
      server:
        condition: service_started

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - server

volumes:
  postgres-data:
  redis-data:
