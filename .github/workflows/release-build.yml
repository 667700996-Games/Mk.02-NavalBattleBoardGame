name: Release Artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or SHA to package
        required: true
        default: main

concurrency:
  group: release-build-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify-build-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk01
          POSTGRES_PASSWORD: mk01
          POSTGRES_DB: mk01_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk01 -d mk01_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://mk01:mk01@127.0.0.1:5432/mk01_release
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      REQUIRE_DISTRIBUTED_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify release source
        run: |
          npm run check
          npm run lint
          npm test
          npm run build
          npm run budget
          npm audit --audit-level=moderate
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable build metadata
        id: metadata
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          source_epoch="$(git show -s --format=%ct HEAD)"
          source_date="$(date -u -d "${source_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          echo "server_name=ghcr.io/${owner}/mk01-server" >> "$GITHUB_OUTPUT"
          echo "web_name=ghcr.io/${owner}/mk01-web" >> "$GITHUB_OUTPUT"
          echo "source_epoch=${source_epoch}" >> "$GITHUB_OUTPUT"
          echo "source_date=${source_date}" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push server once
        id: server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.server_name }}:sha-${{ steps.metadata.outputs.git_sha }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_epoch }}
            BUILD_DATE=${{ steps.metadata.outputs.source_date }}
            VCS_REF=${{ steps.metadata.outputs.git_sha }}
            VERSION=sha-${{ steps.metadata.outputs.git_sha }}
      - name: Build and push web once
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.web_name }}:sha-${{ steps.metadata.outputs.git_sha }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_epoch }}
            BUILD_DATE=${{ steps.metadata.outputs.source_date }}
            VCS_REF=${{ steps.metadata.outputs.git_sha }}
            VERSION=sha-${{ steps.metadata.outputs.git_sha }}
      - run: mkdir -p .artifacts
      - name: Generate server SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.metadata.outputs.server_name }}@${{ steps.server.outputs.digest }}
          format: spdx-json
          output-file: .artifacts/server.spdx.json
          artifact-name: server-sbom
          upload-artifact: false
          upload-release-assets: false
      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.metadata.outputs.web_name }}@${{ steps.web.outputs.digest }}
          format: spdx-json
          output-file: .artifacts/web.spdx.json
          artifact-name: web-sbom
          upload-artifact: false
          upload-release-assets: false
      - name: Attest server provenance
        id: server_provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.metadata.outputs.server_name }}
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
      - name: Attest web provenance
        id: web_provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.metadata.outputs.web_name }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Attest server SBOM
        id: server_sbom_attest
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.metadata.outputs.server_name }}
          subject-digest: ${{ steps.server.outputs.digest }}
          sbom-path: .artifacts/server.spdx.json
          push-to-registry: true
      - name: Attest web SBOM
        id: web_sbom_attest
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.metadata.outputs.web_name }}
          subject-digest: ${{ steps.web.outputs.digest }}
          sbom-path: .artifacts/web.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Keyless-sign both immutable images
        env:
          SERVER_IMAGE: ${{ steps.metadata.outputs.server_name }}@${{ steps.server.outputs.digest }}
          WEB_IMAGE: ${{ steps.metadata.outputs.web_name }}@${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "$SERVER_IMAGE"
          cosign sign --yes "$WEB_IMAGE"
      - name: Create immutable release manifest
        run: |
          node tools/release-manifest.mjs \
            --git-sha "${{ steps.metadata.outputs.git_sha }}" \
            --source-date-epoch "${{ steps.metadata.outputs.source_epoch }}" \
            --server-image "${{ steps.metadata.outputs.server_name }}@${{ steps.server.outputs.digest }}" \
            --web-image "${{ steps.metadata.outputs.web_name }}@${{ steps.web.outputs.digest }}" \
            --server-sbom "${{ steps.server_sbom_attest.outputs.attestation-url }}" \
            --web-sbom "${{ steps.web_sbom_attest.outputs.attestation-url }}" \
            --provenance "${{ steps.server_provenance.outputs.attestation-url }},${{ steps.web_provenance.outputs.attestation-url }}" \
            --signature "oci://${{ steps.metadata.outputs.server_name }}@${{ steps.server.outputs.digest }}#cosign,oci://${{ steps.metadata.outputs.web_name }}@${{ steps.web.outputs.digest }}#cosign" \
            --output .artifacts/release-manifest.json
          node tools/release-gate.mjs --manifest-only true --manifest .artifacts/release-manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: |
            .artifacts/release-manifest.json
            .artifacts/server.spdx.json
            .artifacts/web.spdx.json
            deploy/compose.release.yaml
            deploy/Caddyfile
            deploy/environments/
          retention-days: 90
          if-no-files-found: error
