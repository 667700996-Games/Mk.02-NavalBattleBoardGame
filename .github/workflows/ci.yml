name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run contract
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run budget
      - run: npm audit --audit-level=moderate

  postgres-redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk01
          POSTGRES_PASSWORD: mk01
          POSTGRES_DB: mk01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk01 -d mk01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://mk01:mk01@127.0.0.1:5432/mk01_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      REQUIRE_DISTRIBUTED_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run serialized service-backed integration suite
        run: npm run test:distributed
      - name: Verify migrated database and preserved snapshots
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          STORAGE_MODE: postgres
        run: |
          mkdir -p .artifacts
          cargo run -p mk01-server -- --verify-restore | tee .artifacts/distributed-database-verification.json
          expected_migrations="$(awk 'NF { count += 1 } END { print count }' apps/server/migrations/checksums.sha256)"
          jq -e --argjson expected "$expected_migrations" '.migrationsApplied == $expected and .rooms > 0 and .results > 0 and .balanceRulesets >= 1' .artifacts/distributed-database-verification.json
      - uses: actions/upload-artifact@v6
        with:
          name: postgres-redis-integration-${{ github.sha }}
          path: .artifacts/distributed-database-verification.json
          retention-days: 90
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, postgres-redis-integration]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          CI: "true"
      - run: npm run test:performance
        env:
          CI: "true"

  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Prometheus alert rules with promtool
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/ops/observability:/etc/mk01:ro"
          prom/prometheus:v2.53.0
          check rules /etc/mk01/prometheus-rules.json
      - name: Validate Alertmanager routing with amtool
        run: >-
          docker run --rm --entrypoint /bin/amtool
          -v "$PWD/ops/observability:/etc/mk01:ro"
          prom/alertmanager:v0.27.0
          check-config /etc/mk01/alertmanager.yml

  backup-restore-drill:
    runs-on: ubuntu-latest
    needs: [quality, postgres-redis-integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk01
          POSTGRES_PASSWORD: mk01
          POSTGRES_DB: mk01_backup_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk01 -d mk01_backup_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://mk01:mk01@127.0.0.1:5432/mk01_backup_source
      STORAGE_MODE: postgres
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - name: Install PostgreSQL and GPG clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg
      - name: Build maintenance binary and seed a migration-complete source
        run: |
          cargo build --release -p mk01-server
          target/release/mk01-server --migrate-only
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/tests/fixtures/privacy-backup-source.sql
      - name: Create encrypted backup and meet restore RPO/RTO
        run: |
          umask 077
          mkdir -p .artifacts/backups
          openssl rand -base64 48 > .artifacts/backup-passphrase
          backup_file="$(BACKUP_DESTINATION="$PWD/.artifacts/backups" BACKUP_PASSPHRASE_FILE="$PWD/.artifacts/backup-passphrase" scripts/backup-postgres.sh)"
          drill_now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg now "$drill_now" '{formatVersion:1,generatedAt:$now,tombstones:[{accountId:"00000000-0000-4000-8000-000000000010",requestId:"00000000-0000-4000-8000-000000000020",subjectFingerprint:("c" * 64),deletedAt:$now}]}' > .artifacts/deletion-request.json
          source_deletion_report="$(target/release/mk01-server --apply-deletion-ledger .artifacts/deletion-request.json)"
          jq -e '.applied == 1 and .remainingPersonalRecords == 0' <<< "$source_deletion_report"
          ledger_file="$(DELETION_LEDGER_DESTINATION="$PWD/.artifacts/backups" DELETION_LEDGER_PASSPHRASE_FILE="$PWD/.artifacts/backup-passphrase" MK01_SERVER_BIN="$PWD/target/release/mk01-server" scripts/export-deletion-ledger.sh)"
          psql "postgres://mk01:mk01@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mk01_restore'
          BACKUP_FILE="$backup_file" \
            BACKUP_PASSPHRASE_FILE="$PWD/.artifacts/backup-passphrase" \
            DELETION_LEDGER_FILE="$ledger_file" \
            DELETION_LEDGER_PASSPHRASE_FILE="$PWD/.artifacts/backup-passphrase" \
            TARGET_DATABASE_URL='postgres://mk01:mk01@127.0.0.1:5432/mk01_restore' \
            MK01_SERVER_BIN="$PWD/target/release/mk01-server" \
            RESTORE_RTO_SECONDS=120 \
            MAX_BACKUP_AGE_SECONDS=300 \
            MAX_DELETION_LEDGER_AGE_SECONDS=300 \
            RESTORE_EVIDENCE_FILE="$PWD/.artifacts/restore-evidence.json" \
            scripts/restore-postgres-drill.sh
          jq -e '.database.sessions == 0 and .database.rankedRatings == 0 and .database.rankedStandings == 0 and .database.rankedRewards == 0 and .database.deletionTombstones == 1 and .database.rankedLeaderboardSnapshots == 1 and .deletionLedgerApplication.applied == 1 and .deletionLedgerApplication.remainingPersonalRecords == 0 and .restoreSeconds <= .rtoGateSeconds and .backupAgeSeconds <= .rpoGateSeconds and .deletionLedgerAgeSeconds <= .deletionLedgerFreshnessGateSeconds' .artifacts/restore-evidence.json
          retained_evidence="$(psql 'postgres://mk01:mk01@127.0.0.1:5432/mk01_restore' -Atc "SELECT (SELECT count(*) FROM player_reports WHERE id='00000000-0000-4000-8000-000000000041'),(SELECT count(*) FROM player_moderation_actions WHERE id='00000000-0000-4000-8000-000000000042')")"
          test "$retained_evidence" = '1|0'
      - uses: actions/upload-artifact@v6
        with:
          name: postgres-restore-drill-${{ github.sha }}
          path: .artifacts/restore-evidence.json
          retention-days: 90
          if-no-files-found: error
