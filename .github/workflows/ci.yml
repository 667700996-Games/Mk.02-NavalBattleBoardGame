name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run contract
      - run: npm run architecture:check
      - run: npm run quality-gates:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run budget
      - run: npm audit --audit-level=moderate

  risk-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk01
          POSTGRES_PASSWORD: mk01
          POSTGRES_DB: mk01_coverage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk01 -d mk01_coverage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://mk01:mk01@127.0.0.1:5432/mk01_coverage
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      REQUIRE_DISTRIBUTED_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: llvm-tools-preview
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: npm run test:coverage:web
      - run: npm run test:coverage:rust
      - run: node tools/check-quality-gates.mjs --coverage
      - uses: actions/upload-artifact@v6
        with:
          name: risk-coverage-${{ github.sha }}
          path: |
            .artifacts/rust-coverage.json
            apps/web/coverage/coverage-summary.json
            apps/web/coverage/lcov.info
          retention-days: 30
          if-no-files-found: error

  protocol-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: npm run test:fuzz
        env:
          FUZZ_TOOLCHAIN: nightly-2026-08-18
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: protocol-fuzz-failures-${{ github.sha }}
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore

  postgres-redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk01
          POSTGRES_PASSWORD: mk01
          POSTGRES_DB: mk01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk01 -d mk01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://mk01:mk01@127.0.0.1:5432/mk01_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      REQUIRE_DISTRIBUTED_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run serialized service-backed integration suite
        run: npm run test:distributed
      - name: Verify migrated database and preserved snapshots
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          STORAGE_MODE: postgres
        run: |
          mkdir -p .artifacts
          cargo run -p mk01-server -- --verify-restore | tee .artifacts/distributed-database-verification.json
          expected_migrations="$(awk 'NF { count += 1 } END { print count }' apps/server/migrations/checksums.sha256)"
          jq -e --argjson expected "$expected_migrations" '.migrationsApplied == $expected and .rooms > 0 and .results > 0 and .balanceRulesets >= 1' .artifacts/distributed-database-verification.json
      - uses: actions/upload-artifact@v6
        with:
          name: postgres-redis-integration-${{ github.sha }}
          path: .artifacts/distributed-database-verification.json
          retention-days: 90
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, postgres-redis-integration]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          CI: "true"
      - run: npm run test:performance
        env:
          CI: "true"
      - run: npm run test:visual
        env:
          CI: "true"

  reliability-load:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run authenticated HTTP and WebSocket load test
        run: npm run test:load
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: load-evidence-${{ github.sha }}
          path: |
            .artifacts/load-summary.json
            .artifacts/load-server.log
          retention-days: 30
          if-no-files-found: error

  dependency-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk01
          POSTGRES_PASSWORD: mk01
          POSTGRES_DB: mk01_chaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk01 -d mk01_chaos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.12.0
        ports:
          - 8474:8474
          - 15432:15432
          - 16379:16379
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure dependency proxies
        run: |
          curl --fail --retry 20 --retry-delay 1 --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"name":"postgres","listen":"0.0.0.0:15432","upstream":"postgres:5432"}' \
            http://127.0.0.1:8474/proxies
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"name":"redis","listen":"0.0.0.0:16379","upstream":"redis:6379"}' \
            http://127.0.0.1:8474/proxies
      - name: Start distributed server through proxies
        env:
          STORAGE_MODE: postgres
          DATABASE_URL: postgres://mk01:mk01@127.0.0.1:15432/mk01_chaos
          REDIS_URL: redis://127.0.0.1:16379/
          DISTRIBUTED_COORDINATION_REQUIRED: "true"
          SERVER_PORT: "18084"
          HTTP_REQUESTS_PER_MINUTE_PER_IP: "0"
          API_REQUESTS_PER_MINUTE: "0"
          SESSION_CREATIONS_PER_MINUTE: "0"
          RUST_LOG: warn
        run: |
          mkdir -p .artifacts
          cargo run -p mk01-server >.artifacts/chaos-server.log 2>&1 &
          echo "$!" >.artifacts/chaos-server.pid
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:18084/api/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:chaos
      - name: Stop chaos server
        if: always()
        run: kill "$(cat .artifacts/chaos-server.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: chaos-evidence-${{ github.sha }}
          path: |
            .artifacts/chaos-evidence.json
            .artifacts/chaos-server.log
          retention-days: 90
          if-no-files-found: error

  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Prometheus alert rules with promtool
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/ops/observability:/etc/mk01:ro"
          prom/prometheus:v2.53.0
          check rules /etc/mk01/prometheus-rules.json
      - name: Validate Alertmanager routing with amtool
        run: >-
          docker run --rm --entrypoint /bin/amtool
          -v "$PWD/ops/observability:/etc/mk01:ro"
          prom/alertmanager:v0.27.0
          check-config /etc/mk01/alertmanager.yml

  backup-restore-drill:
    runs-on: ubuntu-latest
    needs: [quality, postgres-redis-integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk01
          POSTGRES_PASSWORD: mk01
          POSTGRES_DB: mk01_backup_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk01 -d mk01_backup_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://mk01:mk01@127.0.0.1:5432/mk01_backup_source
      STORAGE_MODE: postgres
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Install PostgreSQL and GPG clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg
      - name: Build maintenance binary and seed a migration-complete source
        run: |
          cargo build --release -p mk01-server
          target/release/mk01-server --migrate-only
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/tests/fixtures/privacy-backup-source.sql
      - name: Create encrypted backup and meet restore RPO/RTO
        run: |
          umask 077
          mkdir -p .artifacts/backups
          openssl rand -base64 48 > .artifacts/backup-passphrase
          backup_file="$(BACKUP_DESTINATION="$PWD/.artifacts/backups" BACKUP_PASSPHRASE_FILE="$PWD/.artifacts/backup-passphrase" scripts/backup-postgres.sh)"
          drill_now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg now "$drill_now" '{formatVersion:1,generatedAt:$now,tombstones:[{accountId:"00000000-0000-4000-8000-000000000010",requestId:"00000000-0000-4000-8000-000000000020",subjectFingerprint:("c" * 64),deletedAt:$now}]}' > .artifacts/deletion-request.json
          source_deletion_report="$(target/release/mk01-server --apply-deletion-ledger .artifacts/deletion-request.json)"
          jq -e '.applied == 1 and .remainingPersonalRecords == 0' <<< "$source_deletion_report"
          ledger_file="$(DELETION_LEDGER_DESTINATION="$PWD/.artifacts/backups" DELETION_LEDGER_PASSPHRASE_FILE="$PWD/.artifacts/backup-passphrase" MK01_SERVER_BIN="$PWD/target/release/mk01-server" scripts/export-deletion-ledger.sh)"
          psql "postgres://mk01:mk01@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mk01_restore'
          BACKUP_FILE="$backup_file" \
            BACKUP_PASSPHRASE_FILE="$PWD/.artifacts/backup-passphrase" \
            DELETION_LEDGER_FILE="$ledger_file" \
            DELETION_LEDGER_PASSPHRASE_FILE="$PWD/.artifacts/backup-passphrase" \
            TARGET_DATABASE_URL='postgres://mk01:mk01@127.0.0.1:5432/mk01_restore' \
            MK01_SERVER_BIN="$PWD/target/release/mk01-server" \
            RESTORE_RTO_SECONDS=120 \
            MAX_BACKUP_AGE_SECONDS=300 \
            MAX_DELETION_LEDGER_AGE_SECONDS=300 \
            RESTORE_EVIDENCE_FILE="$PWD/.artifacts/restore-evidence.json" \
            scripts/restore-postgres-drill.sh
          jq -e '.database.sessions == 0 and .database.rankedRatings == 0 and .database.rankedStandings == 0 and .database.rankedRewards == 0 and .database.deletionTombstones == 1 and .database.rankedLeaderboardSnapshots == 1 and .deletionLedgerApplication.applied == 1 and .deletionLedgerApplication.remainingPersonalRecords == 0 and .restoreSeconds <= .rtoGateSeconds and .backupAgeSeconds <= .rpoGateSeconds and .deletionLedgerAgeSeconds <= .deletionLedgerFreshnessGateSeconds' .artifacts/restore-evidence.json
          retained_evidence="$(psql 'postgres://mk01:mk01@127.0.0.1:5432/mk01_restore' -Atc "SELECT (SELECT count(*) FROM player_reports WHERE id='00000000-0000-4000-8000-000000000041'),(SELECT count(*) FROM player_moderation_actions WHERE id='00000000-0000-4000-8000-000000000042')")"
          test "$retained_evidence" = '1|0'
      - uses: actions/upload-artifact@v6
        with:
          name: postgres-restore-drill-${{ github.sha }}
          path: .artifacts/restore-evidence.json
          retention-days: 90
          if-no-files-found: error
